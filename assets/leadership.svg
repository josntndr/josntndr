    <text x="43" y="79" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">Helped identify and communicate with potential partners and sponsors for student-led events.</text>
    <circle cx="31" cy="96" r="3" fill="#A78BFA"/>
    <text x="43" y="100" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">Assisted in preparing partnership proposals and coordinating collaboration requirements.</text>
