      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>text { opacity: 0.999; }</style>
  </defs>

  <rect x="1" y="1" width="1198" height="578" rx="24" fill="url(#background)" stroke="#334155" stroke-opacity="0.76" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="578" rx="24" fill="url(#glow)"/>
