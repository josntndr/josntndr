<svg width="1200" height="580" viewBox="0 0 1200 580" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">Josephine Santander&apos;s leadership experience</title>
  <desc id="desc">A timeline of four student leadership roles from 2023 to the present.</desc>
  <defs>
    <linearGradient id="background" x1="18" y1="16" x2="1182" y2="564" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.53" stop-color="#10152A"/>
      <stop offset="1" stop-color="#1B1025"/>
    </linearGradient>
    <linearGradient id="timeline" x1="63" y1="78" x2="63" y2="542" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.42" stop-color="#A78BFA"/>
      <stop offset="0.72" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1048 34) rotate(140) scale(340 470)">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow" x="-250%" y="-250%" width="600%" height="600%" color-interpolation-filters="sRGB">
