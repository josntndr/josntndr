<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Profile mini game board</title>
  <desc id="desc">A colorful arcade-inspired mission board for Josephine's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.42" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="track" x1="84" y1="251" x2="1118" y2="251" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.42" stop-color="#2DD4BF"/>
      <stop offset="0.68" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="soft" x="40" y="26" width="1120" height="312" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <rect x="58" y="44" width="1084" height="264" rx="24" fill="#0B1220" stroke="#334155"/>
    <text x="84" y="94" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="900">Profile Mini Game</text>
    <text x="84" y="126" fill="#BAE6FD" font-family="Consolas, Menlo, monospace" font-size="15">click the README quests below to explore the profile</text>
    <g transform="translate(84 164)">
      <rect width="236" height="78" rx="16" fill="#020617" stroke="#38BDF8"/>
      <text x="22" y="30" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">QUEST 01</text>
      <text x="22" y="58" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="900">Collect Tools</text>
    </g>
    <g transform="translate(356 164)">
      <rect width="236" height="78" rx="16" fill="#020617" stroke="#2DD4BF"/>
      <text x="22" y="30" fill="#2DD4BF" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">QUEST 02</text>
      <text x="22" y="58" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="900">Build Map</text>
    </g>
    <g transform="translate(628 164)">
      <rect width="236" height="78" rx="16" fill="#020617" stroke="#FACC15"/>
      <text x="22" y="30" fill="#FACC15" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">QUEST 03</text>
      <text x="22" y="58" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="900">Meet The Work</text>
    </g>
    <g transform="translate(900 164)">
      <rect width="218" height="78" rx="16" fill="#020617" stroke="#FB923C"/>
      <text x="22" y="30" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">FINAL</text>
      <text x="22" y="58" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="900">Connect</text>
    </g>
    <path d="M92 274H1108" stroke="url(#track)" stroke-width="6" stroke-linecap="round"/>
    <g>
      <circle cx="198" cy="274" r="12" fill="#38BDF8">
        <animate attributeName="r" values="10;15;10" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="474" cy="274" r="12" fill="#2DD4BF">
        <animate attributeName="r" values="10;15;10" dur="1.8s" begin="0.25s" repeatCount="indefinite"/>
      </circle>
      <circle cx="746" cy="274" r="12" fill="#FACC15">
        <animate attributeName="r" values="10;15;10" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1008" cy="274" r="12" fill="#FB923C">
        <animate attributeName="r" values="10;15;10" dur="1.8s" begin="0.75s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="92" cy="274" r="8" fill="#F8FAFC">
      <animate attributeName="cx" values="92;198;474;746;1008;1108" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#38BDF8;#2DD4BF;#FACC15;#FB923C;#F8FAFC" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="1012" y="94" fill="#F8FAFC" font-family="Consolas, Menlo, monospace" font-size="16" text-anchor="end">score: memorable</text>
    <text x="1012" y="124" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="16" text-anchor="end">level: creative dev</text>
  </g>
</svg>
