<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">Josephine Santander — creative developer and interface designer</title>
  <desc id="desc">A refined dark portfolio banner with soft violet, teal, and coral accents.</desc>
  <defs>
    <style>
      text { opacity: 0.999; }
      .display { paint-order: stroke; stroke: #F8FAFC; stroke-width: 0.35px; stroke-linejoin: round; }
    </style>
    <linearGradient id="background" x1="30" y1="20" x2="1170" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.56" stop-color="#11162A"/>
      <stop offset="1" stop-color="#160F25"/>
    </linearGradient>
    <linearGradient id="accent" x1="93" y1="312" x2="1089" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(938 44) rotate(127) scale(310 400)">
      <stop stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(118 354) rotate(-35) scale(260 320)">
      <stop stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#030712" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#CBD5E1" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#background)"/>
  <rect width="1200" height="390" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="390" rx="28" fill="url(#violetGlow)"/>
  <rect width="1200" height="390" rx="28" fill="url(#tealGlow)"/>
  <rect x="1" y="1" width="1198" height="388" rx="27" stroke="#CBD5E1" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(72 48)">
    <rect width="52" height="52" rx="15" fill="#F8FAFC"/>
    <text x="26" y="35" fill="#0B1020" font-family="Arial, sans-serif" font-size="21" font-weight="900" text-anchor="middle">JS</text>
    <text x="70" y="21" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="16" font-weight="700">JOSEPHINE SANTANDER</text>
    <text x="70" y="43" fill="#94A3B8" font-family="Consolas, monospace" font-size="13">creative developer · interface designer</text>
  </g>

  <g transform="translate(72 145)">
    <text class="display" x="0" y="0" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="51" font-weight="800" letter-spacing="-1.2">Clear ideas.</text>
    <text class="display" x="0" y="59" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="51" font-weight="800" letter-spacing="-1.2">Thoughtful interfaces.</text>
    <text x="2" y="108" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18">Designing useful digital products from first sketch to final ship.</text>
  </g>

  <g transform="translate(72 308)" font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <rect width="135" height="34" rx="17" fill="#0F2430" stroke="#5EEAD4" stroke-opacity="0.28"/>
    <text x="67.5" y="22" fill="#99F6E4" text-anchor="middle">PRODUCT UX</text>
    <rect x="147" width="128" height="34" rx="17" fill="#201B39" stroke="#A78BFA" stroke-opacity="0.32"/>
    <text x="211" y="22" fill="#DDD6FE" text-anchor="middle">FRONTEND</text>
    <rect x="287" width="145" height="34" rx="17" fill="#321923" stroke="#FB7185" stroke-opacity="0.3"/>
    <text x="359.5" y="22" fill="#FECDD3" text-anchor="middle">AI WORKFLOWS</text>
  </g>

  <g filter="url(#shadow)" transform="translate(786 70)">
    <rect width="334" height="249" rx="22" fill="#0A0E1B" stroke="#A78BFA" stroke-opacity="0.28"/>
    <circle cx="24" cy="25" r="5" fill="#FB7185"/>
    <circle cx="42" cy="25" r="5" fill="#FACC15"/>
    <circle cx="60" cy="25" r="5" fill="#5EEAD4"/>
    <text x="310" y="30" fill="#64748B" font-family="Consolas, monospace" font-size="11" text-anchor="end">build.flow</text>
    <path d="M20 50H314" stroke="#334155" stroke-opacity="0.75"/>

    <g transform="translate(28 75)" font-family="Arial, sans-serif">
      <circle cx="14" cy="10" r="10" fill="#5EEAD4" fill-opacity="0.14" stroke="#5EEAD4"/>
      <path d="M9 10L12.5 13.5L19 7" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="15" fill="#E2E8F0" font-size="14" font-weight="700">Discover the real need</text>

      <circle cx="14" cy="48" r="10" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA"/>
      <path d="M9 48L12.5 51.5L19 45" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="53" fill="#E2E8F0" font-size="14" font-weight="700">Design the clear path</text>

      <circle cx="14" cy="86" r="10" fill="#FB7185" fill-opacity="0.14" stroke="#FB7185"/>
      <path d="M9 86L12.5 89.5L19 83" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="91" fill="#E2E8F0" font-size="14" font-weight="700">Build with intention</text>

      <circle cx="14" cy="124" r="10" fill="#FACC15" fill-opacity="0.14" stroke="#FACC15"/>
      <circle cx="14" cy="124" r="3.5" fill="#FACC15"/>
      <text x="40" y="129" fill="#F8FAFC" font-size="14" font-weight="700">Refine &amp; ship</text>
    </g>

    <rect x="28" y="224" width="278" height="4" rx="2" fill="#1E293B"/>
    <rect x="28" y="224" width="218" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <path d="M72 365H1128" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
</svg>
