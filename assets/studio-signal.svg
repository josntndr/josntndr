<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Studio signal board</title>
  <desc id="desc">A dashboard-style board showing Josephine's focus areas and current creative signal.</desc>
  <defs>
    <linearGradient id="edge" x1="38" y1="30" x2="1162" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="268" rx="22" fill="#020617" stroke="#1F2937" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="214" rx="18" fill="#0F172A"/>
  <rect x="28" y="28" width="1144" height="214" rx="18" stroke="url(#edge)" stroke-opacity="0.7" stroke-width="2"/>
  <g transform="translate(68 62)">
    <text x="0" y="0" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="14">CURRENT TRANSMISSION</text>
    <text x="0" y="44" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Building a digital identity with style, structure, and intent.</text>
    <text x="0" y="83" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">I turn learning into visible work: polished interfaces, useful projects, and creative experiments.</text>
    <g transform="translate(0 122)">
      <rect width="146" height="34" rx="17" fill="#082F49"/>
      <text x="22" y="23" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">WEB DESIGN</text>
      <rect x="164" width="128" height="34" rx="17" fill="#134E4A"/>
      <text x="187" y="23" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">FRONTEND</text>
      <rect x="310" width="119" height="34" rx="17" fill="#7C2D12"/>
      <text x="333" y="23" fill="#FED7AA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">AI TOOLS</text>
    </g>
  </g>
  <g transform="translate(842 62)">
