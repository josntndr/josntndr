name: Refresh Creative Compass

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: creative-compass-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh Creative Compass
        run: node scripts/update-profile.mjs

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/creative-compass.svg
          if git diff --cached --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git commit -m "chore: refresh Creative Compass"
          git push
